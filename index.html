    catLabel();
    try { var tday = etNow().day; var sun = tday === 0;
      document.querySelectorAll('#sb .hrs span').forEach(function (sp) {
        var k = sp.dataset.t, on = sun ? (k === 'su' || k === 'suh') : (k === 'ms' || k === 'msh');
        sp.style.color = on ? '#C9A24A' : ''; sp.style.fontWeight = on ? '600' : '';
      }); } catch (e) {}
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && body.classList.contains('sbo')) setOpen(false); });
  document.getElementById('sb').addEventListener('click', function (e) {
    if (e.target.closest('a[href^="#"], .cats button')) setOpen(false);
  });
  var PG = 'home';
  window.syncSidebar = function (lg, tabs, pg) {
    if (pg) PG = pg;
    lang = lg;
    document.querySelectorAll('#sb [data-t]').forEach(function (el) { el.textContent = L[lg][el.dataset.t]; });
    btn.setAttribute('aria-label', body.classList.contains('sbo') ? L[lg].close : L[lg].open);
    var cats = document.getElementById('sbCats'); cats.innerHTML = '';
    (tabs || []).forEach(function (t, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = t.label;
      b.addEventListener('click', function () {
        comp.setState({ tab: i });
        if (location.hash !== '#menu') { location.hash = 'menu'; }
        else { var m = document.getElementById('menu'); if (m) m.scrollIntoView({behavior: 'smooth'}); }
      });
      cats.appendChild(b);
    });
    catLabel();
    spy();
  };
  var links = document.querySelectorAll('#sb nav a[data-sec]');
  function spy() {
    var cur = PG === 'home' ? 'inicio' : PG;
    if (PG === 'home') ['inicio','pickup','visitanos'].forEach(function (id) {
      var el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 160) cur = id;
    });
    links.forEach(function (a) { a.classList.toggle('on', a.dataset.sec === cur); });
  }
  window.addEventListener('scroll', spy, {passive: true});
  render();
})();
</script>
</body>
</html>
